<title>Control de Viáticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: expediente de trabajo. Bandeja a la izquierda, expediente del viático a la derecha; en teléfono se alternan. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#14221E; --muted:#5A6B65;
  --line:#D8E0DC; --line-strong:#B6C3BD; --neutral-soft:#E6ECE9;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#DDF0EA;
  --ok:#1A7A47; --ok-soft:#DCF1E5; --warn:#935500; --warn-soft:#FBEBCE;
  --crit:#B3261E; --crit-soft:#FBE0DD; --info:#2557A7; --info-soft:#E0EAF9;
  --font-head:'Schibsted Grotesk','IBM Plex Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#141D1A; --surface-2:#19241F; --ink:#E5EEEA; --muted:#93A59E;
    --line:#26352F; --line-strong:#3A4D45; --neutral-soft:#1F2D28;
    --accent:#4FC3AA; --accent-ink:#06201A; --accent-soft:#133A32;
    --ok:#52C98C; --ok-soft:#153626; --warn:#E5A53C; --warn-soft:#3A2B0F;
    --crit:#F2807A; --crit-soft:#3F1C1A; --info:#86AEF3; --info-soft:#192944;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141D1A; --surface-2:#19241F; --ink:#E5EEEA; --muted:#93A59E;
  --line:#26352F; --line-strong:#3A4D45; --neutral-soft:#1F2D28;
  --accent:#4FC3AA; --accent-ink:#06201A; --accent-soft:#133A32;
  --ok:#52C98C; --ok-soft:#153626; --warn:#E5A53C; --warn-soft:#3A2B0F;
  --crit:#F2807A; --crit-soft:#3F1C1A; --info:#86AEF3; --info-soft:#192944;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono,.folio{font-family:var(--font-mono);font-size:12.5px}
.folio{font-weight:500;letter-spacing:.02em}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-size:18px}
.brand svg{flex:none;color:var(--accent)}
.tag{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line-strong);padding:1px 6px;border-radius:3px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:500;min-width:0;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:not(.on):hover{background:var(--surface-2)}
@media (max-width:560px){.seg{width:100%}.seg button{flex:1;padding:9px 4px;font-size:13px}}
.note{font-size:12.5px;color:var(--muted);padding-bottom:10px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:20px;text-align:center;font-size:11.5px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--crit-soft);color:var(--crit);font-weight:600}

/* Master-detail */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:900px){.cols{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}.back{display:none!important}}
@media (max-width:899px){.cols.has-sel .listcol{display:none}.cols:not(.has-sel) .detail{display:none}}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip b{font-weight:600;margin-left:5px;font-family:var(--font-mono);font-size:12px}
.list{border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer;min-width:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item.on{background:var(--accent-soft)}
.i1,.i2,.i3{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;min-width:0}
.i2{margin-block:3px;align-items:baseline}
.i2 strong{overflow-wrap:anywhere}
.i3{font-size:12.5px;color:var(--muted)}
.amt,.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:13px;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Badges and chips */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 8px;border-radius:999px;background:var(--neutral-soft);color:var(--ink);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:4px;background:var(--neutral-soft);color:var(--ink);margin:1px 4px 1px 0}
.t-ok,.c-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn,.c-warn{background:var(--warn-soft);color:var(--warn)}
.t-crit,.c-crit{background:var(--crit-soft);color:var(--crit)}
.t-info,.c-info{background:var(--info-soft);color:var(--info)}

/* Dossier */
.dossier{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.dossier>section,.dossier>div{padding:16px 18px;border-top:1px solid var(--line)}
.dossier>.dhead{border-top:0}
.dtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.tipo{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dhead h2{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-top:2px}
.back{background:none;border:0;padding:0 0 10px;cursor:pointer;color:var(--accent);font-weight:500}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px}
.st{border-top:4px solid var(--line);padding-top:5px;font-size:12px;color:var(--muted);min-width:0}
.st.done{border-color:var(--accent);color:var(--ink)}
.st.cur{border-color:var(--accent);color:var(--ink);font-weight:600}
.st.cur::after{content:" ●";color:var(--accent)}
.st.stop{border-color:var(--crit);color:var(--crit);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:5px;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 20px;margin:0}
.facts dt,.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts .wide{grid-column:1/-1}
.dossier h3,.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;font-family:var(--font-body);font-weight:600}
.next{font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.dossier>section.act{background:var(--accent-soft)}
.hint{font-size:13px;color:var(--muted)}
.sumline{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:12px}
.sumline div{min-width:0}
.sumline b{display:block;font-family:var(--font-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.timeline li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13px}
.timeline time{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.timeline .who{color:var(--muted)}
@media (max-width:520px){.timeline li{grid-template-columns:1fr;gap:0}}

/* Forms and buttons */
label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:13px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-block:12px}
.fgrid .full{grid-column:1/-1}
.opt{font-weight:400;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:38px;padding:7px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:30px;padding:2px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--crit);font-size:13px;min-height:0;margin-top:8px}
.err:empty{display:none}
.quote{border-left:3px solid var(--warn);padding:4px 12px;background:var(--warn-soft);color:var(--ink);margin-block:8px;border-radius:0 4px 4px 0}
details.addc{margin-top:14px;border:1px dashed var(--line-strong);border-radius:5px;padding:10px 14px}
details.addc summary{cursor:pointer;font-weight:500}
.lectura{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:4px;font-size:13px}
.sims{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-block:10px}
fieldset{border:0;padding:0;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:10px 22px}
legend{padding:0;font-weight:500;font-size:13px;margin-bottom:6px}
label.radio{flex-direction:row;align-items:center;gap:8px;font-weight:400}
label.radio input{width:auto}
label.radio small{color:var(--muted)}
.route{padding:10px 12px;background:var(--surface-2);border-radius:4px;font-size:13px;margin-top:4px}
.params{display:grid;gap:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.inhab{display:flex;flex-wrap:wrap;gap:6px;margin-block:8px}
.inhab .chip button{background:none;border:0;cursor:pointer;margin-left:4px;color:var(--muted);padding:0 2px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.arow:last-child{border-bottom:0}
.arow.crit{box-shadow:inset 4px 0 0 var(--crit)}
.arow.warn{box-shadow:inset 4px 0 0 var(--warn)}
.arow.info{box-shadow:inset 4px 0 0 var(--info)}
.arow p{overflow-wrap:anywhere}
@media (max-width:560px){.arow{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;font-size:13px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
const dd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const sod = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
const shift = (s, n) => { const x = dd(s); x.setDate(x.getDate() + n); return iso(x); };
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const nf = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN'});
const money = n => Number.isInteger(n) ? nf.format(n) : nf2.format(n);
const fmtD = new Intl.DateTimeFormat('es-MX', {weekday:'short', day:'numeric', month:'short'});
const fmtT = new Intl.DateTimeFormat('es-MX', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false});
const fd = s => fmtD.format(dd(s)).replace(/[.,]/g, '');
const ft = s => fmtT.format(new Date(s)).replace(/[.,]/g, '');
const wide = () => matchMedia('(min-width:900px)').matches;
const pad4 = n => String(n).padStart(4, '0');

/* ---------- parámetros y calendario hábil ---------- */
const defaultParams = () => ({
  umbral: 50000, plazoDias: 2, topeNac: 750, topeExt: 1500, efectivoMax: 2000,
  inhabiles: ['2026-11-16', '2026-12-25', '2027-01-01']
});
let S = {params: defaultParams()};
const isBiz = dt => dt.getDay() !== 0 && dt.getDay() !== 6 && !S.params.inhabiles.includes(iso(dt));
function addBD(dt, n) {
  const r = new Date(dt), step = n < 0 ? -1 : 1; let c = Math.abs(n);
  while (c > 0) { r.setDate(r.getDate() + step); if (isBiz(r)) c--; }
  return r;
}
function bdDiff(from, to) {
  if (iso(from) === iso(to)) return 0;
  const sign = to > from ? 1 : -1, a = sign > 0 ? from : to, b = sign > 0 ? to : from;
  let c = 0; const x = new Date(a);
  while (iso(x) < iso(b)) { x.setDate(x.getDate() + 1); if (isBiz(x)) c++; }
  return sign * c;
}
function plazo(r) {
  const dl = addBD(dd(r.regreso), S.params.plazoDias), today = sod(new Date());
  if (today < dd(r.regreso)) return {k:'futuro', dl, txt:'Inicia al regreso (' + fd(r.regreso) + ')'};
  const n = bdDiff(today, dl);
  if (n < 0) return {k:'vencida', n:-n, dl, txt:'Vencida hace ' + (-n) + (n === -1 ? ' día hábil' : ' días hábiles')};
  if (n === 0) return {k:'hoy', dl, txt:'Vence hoy'};
  if (n === 1) return {k:'manana', dl, txt:'Vence mañana'};
  return {k:'ok', n, dl, txt:'Faltan ' + n + ' días hábiles'};
}
const plazoTone = k => ({vencida:'crit', hoy:'warn', manana:'warn'}[k] || 'n');

/* ---------- personas, roles, estados ---------- */
const P = {
  ana:{n:'Ana Torres', a:'Ventas'}, marco:{n:'Marco Peña', a:'Ventas'}, sofia:{n:'Sofía Ibarra', a:'Ventas'},
  luis:{n:'Luis Mendoza', a:'Jefe directo de Ventas'}, carla:{n:'Carla Ruiz', a:'Finanzas'}, admin:{n:'Administrador', a:'Sistemas'}
};
const ROLES = {empleado:{l:'Empleado', u:'ana'}, jefe:{l:'Jefe directo', u:'luis'}, finanzas:{l:'Finanzas', u:'carla'}, admin:{l:'Admin', u:'admin'}};
const EST = {
  pend_jefe:['Por autorizar · Jefe', 'info'], pend_fin:['Por autorizar · Finanzas', 'info'],
  aprobada:['Por entregar anticipo', 'warn'], por_comprobar:['Por comprobar', 'warn'],
  en_revision:['En revisión', 'info'], por_reintegrar:['Reintegro pendiente', 'warn'],
  por_pagar:['Por pagar', 'info'], cerrada:['Cerrada', 'ok'], pagada:['Pagada', 'ok'],
  devuelta:['Devuelta', 'warn'], rechazada:['Rechazada', 'crit']
};
const OWNER = {pend_jefe:'jefe', pend_fin:'finanzas', aprobada:'finanzas', en_revision:'finanzas', por_reintegrar:'finanzas', por_pagar:'finanzas', por_comprobar:'empleado', devuelta:'empleado'};
const FILTERS = {
  empleado:[
    {k:'todas', l:'Todas', f:r => r.emp === 'ana'},
    {k:'comprobar', l:'Por comprobar', f:r => r.emp === 'ana' && r.estado === 'por_comprobar'},
    {k:'tramite', l:'En trámite', f:r => r.emp === 'ana' && !['por_comprobar', 'cerrada', 'pagada', 'rechazada'].includes(r.estado)},
    {k:'cerradas', l:'Cerradas', f:r => r.emp === 'ana' && ['cerrada', 'pagada', 'rechazada'].includes(r.estado)}],
  jefe:[
    {k:'autorizar', l:'Por autorizar', f:r => r.estado === 'pend_jefe'},
    {k:'comprobar', l:'Por comprobar', f:r => r.estado === 'por_comprobar'},
    {k:'todas', l:'Todas', f:() => true}],
  finanzas:[
    {k:'autorizar', l:'Por autorizar', f:r => r.estado === 'pend_fin'},
    {k:'entregar', l:'Por entregar', f:r => r.estado === 'aprobada'},
    {k:'revisar', l:'Por revisar', f:r => r.estado === 'en_revision'},
    {k:'cobros', l:'Pagos y reintegros', f:r => ['por_pagar', 'por_reintegrar'].includes(r.estado)},
    {k:'reembolsos', l:'Reembolsos', f:r => r.tipo === 'reembolso'},
    {k:'todas', l:'Todas', f:() => true}],
  admin:[{k:'todas', l:'Todas', f:() => true}]
};
const TABS = {
  empleado:[{k:'bandeja', l:'Mis solicitudes'}, {k:'nueva', l:'Nueva solicitud'}, {k:'alertas', l:'Alertas'}],
  jefe:[{k:'bandeja', l:'Solicitudes'}, {k:'alertas', l:'Alertas'}],
  finanzas:[{k:'bandeja', l:'Solicitudes'}, {k:'alertas', l:'Alertas'}],
  admin:[{k:'bandeja', l:'Todas las solicitudes'}, {k:'alertas', l:'Alertas'}, {k:'params', l:'Parámetros'}]
};

/* ---------- datos de ejemplo ---------- */
function fakeUuid(s) {
  let h = 2166136261; const out = [];
  for (let i = 0; i < 32; i++) { h ^= s.charCodeAt(i % s.length) + i; h = Math.imul(h, 16777619) >>> 0; out.push(((h >>> ((i * 3) % 20)) & 15).toString(16)); }
  const u = out.join('').toUpperCase();
  return u.slice(0, 8) + '-' + u.slice(8, 12) + '-' + u.slice(12, 16) + '-' + u.slice(16, 20) + '-' + u.slice(20, 32);
}
function seed() {
  const T = sod(new Date()), bd = n => iso(addBD(T, n)), ago = h => new Date(Date.now() - h * 36e5).toISOString();
  const L = (who, act, note, h) => ({at:ago(h), who, act, note:note || ''});
  let k = 0;
  const C = (concepto, prov, fecha, monto, kind, x) => { k++; return Object.assign({id:'c' + k, concepto, prov, fecha, monto, kind, pago:'Tarjeta', estado:'pendiente', rfcOk:true, sat:'vigente', uuid:kind === 'cfdi' ? fakeUuid('s' + k) : ''}, x || {}); };
  const r1 = bd(-2), r2 = bd(-7), r3 = bd(-4), r4 = bd(-15);
  return [
    {id:'VT-0398', ord:1, tipo:'anticipo', emp:'ana', destino:'Guadalajara, Jal.', motivo:'Capacitación de distribuidores', ambito:'nacional', salida:shift(r4, -2), regreso:r4,

const needsFin = r => r.viaFin ?? (r.monto > S.params.umbral);
const daysOf = r => Math.round((dd(r.regreso) - dd(r.salida)) / 864e5) + 1;
function totals(r) {
  const cs = r.comps || [];
  return {
    acept:sum(cs.filter(c => c.estado === 'aceptado'), c => c.monto),
    pend:sum(cs.filter(c => c.estado === 'pendiente'), c => c.monto),
    rech:sum(cs.filter(c => c.estado === 'rechazado'), c => c.monto),
    cap:sum(cs, c => c.monto), nPend:cs.filter(c => c.estado === 'pendiente').length
  };
}
function dupUuid(c) { return c.uuid && S.reqs.some(r => (r.comps || []).some(o => o.id !== c.id && o.uuid === c.uuid)); }
function flags(c) {
  const f = [];
  if (c.kind === 'cfdi') {
    if (c.rfcOk === false) f.push(['crit', 'RFC receptor no coincide']);
    if (c.sat === 'cancelado') f.push(['crit', 'CFDI cancelado ante el SAT']);
    if (dupUuid(c)) f.push(['crit', 'UUID duplicado']);
    if (c.pago === 'Efectivo' && c.monto > S.params.efectivoMax) f.push(['warn', 'Efectivo sobre ' + money(S.params.efectivoMax) + ': no deducible']);
    if (!f.length) f.push(['ok', 'CFDI vigente']);
  } else if (c.kind === 'pdf') f.push(['warn', 'Falta el XML del CFDI']);
  else f.push(['warn', 'Sin CFDI: posible no deducible']);
  return f;
}
function deducible(r) {
  const cs = (r.comps || []).filter(c => c.estado !== 'rechazado');
  let ded = 0, sin = 0;
  cs.forEach(c => {
    if (c.kind === 'cfdi') { if (!(c.rfcOk === false || c.sat === 'cancelado' || (c.pago === 'Efectivo' && c.monto > S.params.efectivoMax))) ded += c.monto; }
    else sin += c.monto;
  });
  const tope = (r.ambito === 'extranjero' ? S.params.topeExt : S.params.topeNac) * daysOf(r);
  const total = sum(cs, c => c.monto), d2 = ded + Math.min(sin, tope);
  return {ded:d2, no:total - d2, sin, tope};
}

function alertsFor(role) {
  const out = [], now = Date.now();
  S.reqs.forEach(r => {
    if (role === 'empleado' && r.emp !== 'ana') return;
    if (r.tipo === 'anticipo' && r.estado === 'por_comprobar') {
      const p = plazo(r);
      if (p.k === 'vencida') out.push({sev:'crit', r, kind:'plazo', txt:'Comprobación ' + p.txt.toLowerCase() + ' (límite ' + fd(iso(p.dl)) + ')'});
      else if (p.k === 'hoy') out.push({sev:'warn', r, kind:'plazo', txt:'La comprobación vence hoy (' + fd(iso(p.dl)) + ')'});
      else if (p.k === 'manana') out.push({sev:'warn', r, kind:'plazo', txt:'La comprobación vence mañana (' + fd(iso(p.dl)) + ')'});
    }
    const own = OWNER[r.estado], h = Math.floor((now - new Date(r.log[r.log.length - 1].at)) / 36e5);
    if (own && own !== 'empleado' && h >= 24 && (role === own || role === 'admin')) out.push({sev:'info', r, kind:'espera', txt:'Sin atender desde hace ' + (h >= 48 ? Math.floor(h / 24) + ' días' : h + ' horas') + ' (' + EST[r.estado][0].toLowerCase() + ')'});
  });
  return out.sort((a, b) => ({crit:0, warn:1, info:2}[a.sev] - {crit:0, warn:1, info:2}[b.sev]));
}

function decide(kind) {
  const r = cur(), note = ($('#coment')?.value || '').trim(), err = $('#actErr'), role = S.role;
  if (kind !== 'aprobar' && !note) { err.textContent = 'Escribe un comentario para que la persona sepa el motivo.'; $('#coment').focus(); return; }
  if (kind === 'aprobar') {
    if (role === 'jefe') {
      r.viaFin = r.monto > S.params.umbral;
      r.estado = r.viaFin ? 'pend_fin' : (r.tipo === 'anticipo' ? 'aprobada' : 'por_pagar');
      addLog(r, 'Aprobada por jefe directo', r.viaFin ? 'Pasa a Finanzas porque ' + money(r.monto) + ' supera ' + money(S.params.umbral) + '. ' + note : note);
      toast(r.viaFin ? 'Aprobada. Pasa a Finanzas por el monto.' : 'Aprobada. No requiere Finanzas.');
    } else {
      r.estado = r.tipo === 'anticipo' ? 'aprobada' : 'por_pagar';
      addLog(r, 'Aprobada por Finanzas', note); toast('Aprobada por Finanzas.');
    }
  } else if (kind === 'devolver') {
    r.estado = 'devuelta'; r.devolvio = role; addLog(r, 'Devuelta con comentarios', note); toast('Devuelta al empleado.');
  } else {
    r.estado = 'rechazada'; r.stopAt = role === 'jefe' ? 'Jefe directo' : 'Finanzas'; addLog(r, 'Rechazada', note); toast('Solicitud rechazada.');
  }
  render();
}

    if (monto <= 0) { err.textContent = 'Captura al menos un concepto con monto.'; return; }
    const id = tipo === 'anticipo' ? 'VT-' + pad4(nextVT++) : 'RB-' + pad4(nextRB++);
    S.reqs.push({id, ord:ord++, tipo, emp:'ana', destino:v('nDestino'), motivo:v('nMotivo'), ambito:$('#nAmb').value, salida:sal, regreso:reg, desglose:des, monto, estado:'pend_jefe', comps:[], log:[{at:new Date().toISOString(), who:'ana', act:'Solicitud creada', note:'Enviada al jefe directo.'}]});
    S.view = 'bandeja'; S.filter = 'todas'; S.sel = id; toast('Solicitud ' + id + ' enviada a tu jefe directo.'); render();
  },
  inhadd() { const x = $('#inhNew').value; if (x && !S.params.inhabiles.includes(x)) { S.params.inhabiles.push(x); toast('Día inhábil agregado.'); render(); } },
  inhdel(b) { S.params.inhabiles = S.params.inhabiles.filter(x => x !== b.dataset.v); render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b);
});
document.addEventListener('input', e => { if (e.target.closest('#nform')) updateNew(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cFiles') {
    const names = [...t.files].map(f => f.name), low = names.map(x => x.toLowerCase());
    if (names.length) applySample(low.some(x => x.endsWith('.xml')) ? 'cfdi' : low.some(x => x.endsWith('.pdf')) ? 'pdf' : 'ticket', names);
  } else if (t.dataset.param) {
    const val = Math.max(0, Number(t.value) || 0); S.params[t.dataset.param] = t.dataset.param === 'plazoDias' ? Math.max(1, Math.round(val)) : val;
    toast('Parámetro actualizado.'); render();
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'addc') S.addOpen = e.target.open; }, true);
matchMedia('(min-width:900px)').addEventListener('change', render);
init(); render();
</script>
